name: Windows ARM x64 compatibility validation

on:
  push:
    branches: ['codex/arm-x64-compat-validation-*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: arm-x64-compat-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows ARM with x64 Python
            os: windows-11-arm
            arch: amd64
            python_arch: x64
            target: win-cpu-installer
            artifact: windows-arm-x64-compat
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      X_ANYLABELING_VARIANT: CPU
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Verify native interpreter
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python -c 'import os, platform, sysconfig; print(platform.machine(), sysconfig.get_platform()); actual = sysconfig.get_platform().removeprefix("win-") if platform.system() == "Windows" else platform.machine(); assert actual.lower() == os.environ["EXPECTED_ARCH"]; assert platform.machine().lower() == "arm64"'
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE) { throw 'Inno Setup installation failed' }
          }
      - name: Install CPU application and development dependencies
        shell: bash
        run: uv pip install --system --only-binary cryptography -e '.[cpu,dev]'
      - name: Validate native dependencies and rendering
        shell: bash
        run: python .validation/native_checks.py
      - name: Run update regression and rollback tests
        shell: bash
        run: python -m pytest -q tests/test_updates
      - name: Prepare ephemeral validation key
        shell: bash
        run: |
          python scripts/generate_update_key.py --output "${RUNNER_TEMP}/signing.key"
          python - <<'PY'
          import base64, os
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          key = Ed25519PrivateKey.from_private_bytes(base64.b64decode((Path(os.environ['RUNNER_TEMP']) / 'signing.key').read_bytes()))
          public = base64.b64encode(key.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw)).decode()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'X_ANYLABELING_UPDATE_PUBLIC_KEY={public}\n')
          PY
      - name: Reuse the verified x64 bundle for update and cleanup validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38116389739 --repo $env:GITHUB_REPOSITORY --name native-validation-windows-arm-x64-compat --dir "$env:RUNNER_TEMP/reused-build"
          if ($LASTEXITCODE) { throw 'Artifact download failed' }
          $archive = Get-ChildItem "$env:RUNNER_TEMP/reused-build/dist/*-Update.zip" | Select-Object -First 1
          python -m zipfile -e $archive.FullName dist
          if ($LASTEXITCODE) { throw 'Bundle restoration failed' }
          Copy-Item "$env:RUNNER_TEMP/reused-build/dist/*-Setup.exe" dist/
          Copy-Item dist/X-AnyLabeling/xanylabeling-updater.exe "$env:RUNNER_TEMP/xanylabeling-updater.exe"
          python scripts/package_updates.py prepare --bundle dist/X-AnyLabeling --variant CPU --helper "$env:RUNNER_TEMP/xanylabeling-updater.exe"
          if ($LASTEXITCODE) { throw 'Bundle preparation failed' }
          python scripts/package_updates.py package --bundle dist/X-AnyLabeling --output dist
          if ($LASTEXITCODE) { throw 'Update archive packaging failed' }
      - name: Verify macOS bundle and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict dist/X-AnyLabeling.app
          mkdir -p "${RUNNER_TEMP}/dmg-volume"
          hdiutil attach -nobrowse -readonly -mountpoint "${RUNNER_TEMP}/dmg-volume" dist/*-unsigned.dmg
          trap 'hdiutil detach "${RUNNER_TEMP}/dmg-volume"' EXIT
          test -x "${RUNNER_TEMP}/dmg-volume/X-AnyLabeling.app/Contents/MacOS/X-AnyLabeling"
          "${RUNNER_TEMP}/dmg-volume/X-AnyLabeling.app/Contents/MacOS/X-AnyLabeling" version
      - name: Verify Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-Setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'native install space'
          $process = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"", '/TASKS=') -Wait -PassThru
          if ($process.ExitCode) { throw "Installation failed: $($process.ExitCode)" }
          if (-not (Test-Path "$destination/X-AnyLabeling.exe")) { throw 'Installed application missing' }
          $process = Start-Process "$destination/X-AnyLabeling.exe" -ArgumentList 'version' -Wait -PassThru
          if ($process.ExitCode) { throw 'Installed application could not start' }
          $process = Start-Process "$destination/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode) { throw 'Uninstall failed' }
          if (Test-Path "$destination/X-AnyLabeling.exe") { throw 'Uninstall left the application executable' }
      - name: Validate signed HTTPS update and real GUI restart
        shell: bash
        env:
          BUILD_PLATFORM: ${{ runner.os }}
        run: |
          bundle=dist/X-AnyLabeling
          if [ "${BUILD_PLATFORM}" = macOS ]; then bundle=dist/X-AnyLabeling.app; fi
          python .validation/smoke_test_updates.py --repo . --bundle "${bundle}" --archive dist/*-Update.zip --signing-key "${RUNNER_TEMP}/signing.key"
      - name: Preserve test reports and packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-validation-${{ matrix.artifact }}
          include-hidden-files: true
          path: |
            .validation-output/
            dist/*-Setup.exe
            dist/*-unsigned.dmg
            dist/*-Update.zip
            dist/*-Update.zip.sha256
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
